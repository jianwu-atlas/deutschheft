<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 纸底 -->
  <rect width="1200" height="630" fill="#F6F1E7"/>
  <rect x="0" y="0" width="1200" height="6" fill="#C9A227"/>
  <rect x="0" y="624" width="1200" height="6" fill="#C9A227"/>

  <!-- 左侧主标（Gilded Seal） -->
  <g transform="translate(118,115) scale(0.78)">
    <rect x="0" y="0" width="512" height="512" rx="118" fill="#201B14"/>
    <rect x="24" y="24" width="464" height="464" rx="98" fill="none" stroke="#C9A227" stroke-opacity="0.16" stroke-width="2"/>
    <text x="256" y="312" font-family="Georgia, 'Times New Roman', serif" font-size="266" font-weight="700" fill="#C9A227" text-anchor="middle">D</text>
    <rect x="192" y="340" width="128" height="6" rx="3" fill="#C9A227"/>
    <circle cx="210" cy="392" r="15" fill="#2456A6"/>
    <circle cx="256" cy="392" r="15" fill="#B03048"/>
    <circle cx="302" cy="392" r="15" fill="#2E7D5B"/>
  </g>

  <!-- 右侧 wordmark -->
  <text x="580" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#201B14">MEIN</text>
  <text x="580" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#201B14">DEUTSCHHEFT</text>
  <rect x="584" y="394" width="286" height="5" rx="2.5" fill="#C9A227"/>
  <text x="585" y="448" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#8A7D66" letter-spacing="4">JIAN &#183; GERMAN A1&#8211;A1.2</text>
  <text x="585" y="494" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#4A4234" letter-spacing="0.5">Lektionen &#183; Wortschatz &#183; Grammatik &#183; Texte</text>
</svg>
