<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- 德语站 logo · 水墨天鹅版（完全参考 Jian 指定图）
       配色采样自参考图：灰绿 #BEC09D / 墨色 #222222 / De Yu 卡其灰绿 #A9AA88（参考图无红印章）
       v3：线穿过圆下缘；天鹅贴圆左侧（头+羽+扇形翅）；德在圆内右半；语/三横在线下；De Yu 左下 -->
  <defs>
    <radialGradient id="ink" cx="45%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#CBD0AC"/>
      <stop offset="62%" stop-color="#BEC09D"/>
      <stop offset="100%" stop-color="#A9AC85"/>
    </radialGradient>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <!-- 水墨灰绿圆 -->
  <circle cx="184" cy="152" r="44" fill="url(#ink)" filter="url(#soft)"/>
  <!-- 山水线（穿过圆下缘）：左端下卷 / 右端上翘小勾 -->
  <g fill="none" stroke="#222222" stroke-linecap="round" stroke-linejoin="round">
    <path d="M132 200 C 172 196, 238 195, 274 197" stroke-width="3.4"/>
    <path d="M274 197 C 281 197, 285 192, 280 187" stroke-width="2.6"/>
    <path d="M132 200 C 124 200, 120 207, 127 210 C 132 212, 136 208, 133 204" stroke-width="2.6"/>
  </g>
  <!-- 天鹅（圆内左侧，展翅飞向左：小圆头 + 喙 + 冠羽扇 + S 颈身 + 四道翅线扇向左） -->
  <g fill="none" stroke="#222222" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="146" cy="157" r="9" stroke-width="2.6"/>
    <path d="M138 149 L130 141" stroke-width="2.2"/>
    <path d="M141 148 L132 134" stroke-width="1.6"/>
    <path d="M147 146 L140 130" stroke-width="1.6"/>
    <path d="M153 147 L149 130" stroke-width="1.6"/>
    <path d="M159 150 L157 132" stroke-width="1.6"/>
    <path d="M155 165 C 166 170, 174 180, 176 190 C 175 199, 167 204, 158 201" stroke-width="2.4"/>
    <path d="M160 181 C 150 172, 140 167, 131 165" stroke-width="2.1"/>
    <path d="M162 188 C 152 181, 143 178, 134 177" stroke-width="2.1"/>
    <path d="M165 194 C 156 190, 147 189, 139 189" stroke-width="2.1"/>
    <path d="M168 199 C 160 197, 152 197, 146 199" stroke-width="2.1"/>
  </g>
  <!-- 竖排「德 / 语」（楷体手写感） -->
  <text x="204" y="150" font-size="42" font-weight="900" fill="#222222" text-anchor="middle"
        font-family="'Kaiti SC','STKaiti','KaiTi','Noto Serif SC','Songti SC','SimSun',serif">德</text>
  <text x="236" y="226" font-size="40" font-weight="900" fill="#222222" text-anchor="middle"
        font-family="'Kaiti SC','STKaiti','KaiTi','Noto Serif SC','Songti SC','SimSun',serif">语</text>
  <!-- 线下三横小装饰 -->
  <g fill="none" stroke="#222222" stroke-linecap="round">
    <path d="M194 208 H218" stroke-width="2.4"/>
    <path d="M190 216 H222" stroke-width="2.4"/>
    <path d="M195 224 H217" stroke-width="2.4"/>
  </g>
  <!-- De Yu（两行卡其灰绿，衬线） -->
  <text x="134" y="236" font-size="16" letter-spacing="1" fill="#A9AA88"
        font-family="Georgia,'Times New Roman',serif">De</text>
  <text x="134" y="253" font-size="16" letter-spacing="1" fill="#A9AA88"
        font-family="Georgia,'Times New Roman',serif">Yu</text>
</svg>
