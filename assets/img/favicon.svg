<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 墨黑圆角方块：印章/书签/钥匙的诚实几何 -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="#201B14"/>
  <!-- 极细内框：手工压印的边界感 -->
  <rect x="24" y="24" width="464" height="464" rx="98" fill="none" stroke="#C9A227" stroke-opacity="0.16" stroke-width="2"/>
  <!-- 主字母 D：德金，Georgia 粗体，占据上 2/3 -->
  <text x="256" y="312" font-family="Georgia, 'Times New Roman', serif" font-size="266" font-weight="700" fill="#C9A227" text-anchor="middle">D</text>
  <!-- 单一细金线：比字母更短，克制收束 -->
  <rect x="192" y="340" width="128" height="6" rx="3" fill="#C9A227"/>
  <!-- 三点：der 蓝 / die 红 / das 绿，水平节奏均等 -->
  <circle cx="210" cy="392" r="15" fill="#2456A6"/>
  <circle cx="256" cy="392" r="15" fill="#B03048"/>
  <circle cx="302" cy="392" r="15" fill="#2E7D5B"/>
</svg>
